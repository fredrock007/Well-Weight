<!DOCTYPE html><html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Siphelo’s WellWeight — Transform your body. Strengthen your life.</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --g1: #0ad1b8;
      --g2: #10b981;
      --cta: #0891b2;
      --cta-ring: rgba(8, 145, 178, .35);
    }* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: 'Inter', sans-serif;
  background: #f7fbf9;
  color: #0b1512;
  overflow-x: hidden;
}

.wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px;
}

/* HERO */
.hero {
  position: relative;
  border-radius: 24px;
  margin-top: 20px;
  background: linear-gradient(135deg, var(--g1), var(--g2));
  color: #03221a;
  box-shadow: 0 18px 40px rgba(14, 34, 26, .14);
  overflow: hidden;
}

.hero-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 90px 24px;
  position: relative;
  z-index: 2;
}

.brand {
  font-size: 3rem;
  font-weight: 800;
  margin: 14px 0 6px;
  text-shadow: 0 2px 3px rgba(0, 0, 0, 0.2);
}

.tagline { font-size: 1.4rem; opacity: .9; }

/* BUTTONS */
.cta-row {
  display: flex;
  gap: 18px;
  margin-top: 26px;
}

.btn {
  font-size: 1.2rem;
  background: var(--cta);
  color: #001e24;
  padding: 16px 26px;
  border: none;
  border-radius: 12px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 10px 24px var(--cta-ring);
  transition: transform .1s, box-shadow .2s;
}

.btn:hover { transform: translateY(-2px); }

.btn.alt {
  background: #d90429;
  color: white;
  box-shadow: 0 10px 24px rgba(217, 4, 41, .4);
}

/* LOGO */
.logo {
  width: 160px;
  height: 160px;
  filter: drop-shadow(0 12px 28px rgba(0, 0, 0, .15));
  transition: transform .2s ease-in-out;
  z-index: 2;
  position: relative;
}

/* LIGHTNING */
.lightning {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  z-index: 1;
  pointer-events: none;
}

.bolt {
  position: absolute;
  width: 3px;
  height: 300px;
  background: white;
  box-shadow: 0 0 40px 10px rgba(255, 255, 255, 0.8);
  opacity: 0;
  transform: rotate(25deg);
  animation: strike 10s infinite ease-in-out;
}

.bolt:nth-child(1) { left: 15%; animation-delay: 2s; }
.bolt:nth-child(2) { left: 55%; animation-delay: 6s; }
.bolt:nth-child(3) { left: 80%; animation-delay: 9s; }

@keyframes strike {
  0%, 94%, 100% { opacity: 0; }
  95% { opacity: 1; transform: translateY(0) rotate(25deg); }
  96% { opacity: 1; transform: translateY(200px) rotate(25deg); }
  97%, 99% { opacity: 0; }
}

.flash {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: white;
  opacity: 0;
  z-index: 1;
  animation: flash 10s infinite ease-in-out;
}

@keyframes flash {
  0%, 94%, 100% { opacity: 0; }
  95% { opacity: 0.8; }
  96% { opacity: 0.4; }
  97%, 99% { opacity: 0; }
}

@keyframes shakeLogo {
  0%, 94%, 100% { transform: none; }
  95% { transform: rotate(3deg); }
  96% { transform: rotate(-3deg); }
  97% { transform: rotate(1deg); }
  98%, 99% { transform: none; }
}

  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="lightning">
        <div class="bolt"></div>
        <div class="bolt"></div>
        <div class="bolt"></div>
        <div class="flash"></div>
      </div>
      <div class="hero-inner">
        <svg class="logo" id="logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <path d="M40,70 C10,55 18,20 52,22 C56,42 53,58 40,70 Z" fill="#35d39f"/>
          <path d="M80,70 C110,55 102,20 68,22 C64,42 67,58 80,70 Z" fill="#53e3c8"/>
          <path d="M60,18 C76,10 92,26 84,42 C70,38 60,33 60,18 Z" fill="#9ff6ea"/>
          <rect x="57" y="60" width="6" height="30" rx="3" fill="#0c7c66"/>
        </svg>
        <div class="brand">Siphelo’s WellWeight</div>
        <div class="tagline">Transform your body. Strengthen your life.</div>
        <div class="cta-row">
          <button class="btn" id="ctaIntro">Book a Free Intro</button>
          <button class="btn alt" id="ctaChat">Open Client Chat</button>
        </div>
      </div>
    </div>
  </div>  <script>
    const logo = document.getElementById('logo');
    const bolts = document.querySelectorAll('.bolt');

    bolts.forEach(b => {
      b.addEventListener('animationiteration', () => {
        logo.style.animation = 'shakeLogo 0.6s';
        setTimeout(() => logo.style.animation = '', 600);
      });
    });
  </script></body>
</html>
