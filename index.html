<!DOCTYPE html><html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Siphelo’s WellWeight — Fitness • Coaching • Supplements</title>
  <meta name="description" content="Prototype site for Siphelo’s WellWeight: personal training, client community chat, and supplements (protein & creatine)." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0e1412;--panel:#121a17;--ink:#e6f3ec;--muted:#b8d1c3;--leaf1:#38b000;--leaf2:#70e000;--leaf3:#008000;--accent:#00c2a8;--ring:rgba(0,194,168,.35);--shadow:0 20px 45px rgba(0,0,0,.45);--radius:18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,#0b110f,#0f1613 30%, #111a16 100%);color:var(--ink)}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    .wrap{max-width:1200px;margin:0 auto;padding:28px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:14px}
    .logo{width:52px;height:52px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35))}
    .title{font-weight:800;letter-spacing:.2px}
    .tag{font-size:.9rem;color:var(--muted)}
    nav a{margin:0 10px;font-weight:600}
    .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:center;margin:12px 0 26px}
    .card{background:linear-gradient(180deg,var(--panel),#0f1814);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);box-shadow:var(--shadow)}
    .hero .card{padding:28px}
    .hero h1{margin:0 0 10px;font-size:2.2rem}
    .hero p{margin:0 0 14px;color:var(--muted)}
    .cta{display:flex;gap:12px;margin-top:10px}
    .btn{background:var(--accent);color:#022; padding:12px 16px;border-radius:12px;border:none;font-weight:800;cursor:pointer;box-shadow:0 10px 25px var(--ring)}
    .btn.alt{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.12)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
    .stat{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px;text-align:center}
    .stat b{display:block;font-size:1.3rem}
    section{margin:34px 0}
    .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
    h2{margin:0;font-size:1.5rem}
    .kicker{color:var(--muted);font-size:.95rem}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
    .col-4{grid-column:span 4}
    .col-6{grid-column:span 6}
    .col-8{grid-column:span 8}
    .tile{background:linear-gradient(180deg,var(--panel),#0f1814);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
    .tile h3{margin:0 0 8px}
    .price{font-weight:800;font-size:1.1rem;margin-top:6px}
    .chip{display:inline-block;padding:5px 9px;border-radius:999px;background:rgba(0,194,168,.15);border:1px solid var(--ring);font-size:.8rem;margin-right:6px}
    /* Hide supplement SVGs */
    .card-img{display:none}
    .chat{display:flex;flex-direction:column;height:420px}
    .chat-log{flex:1;overflow:auto;padding:12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
    .msg{margin:8px 0;max-width:80%}
    .me{margin-left:auto}
    .bubble{padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.06);background:linear-gradient(180deg,#13201b,#0f1814)}
    .bubble.me{background:linear-gradient(180deg,#143c33,#0f1814);border-color:rgba(0,194,168,.35)}
    .meta{font-size:.72rem;color:var(--muted);margin-top:3px}
    .chat-form{display:flex;gap:8px;margin-top:10px}
    .input, textarea{flex:1;background:#0c1411;color:var(--ink);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px}
    footer{margin:34px 0 18px;color:var(--muted);text-align:center}
    @media (max-width: 980px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.col-4,.col-6,.col-8{grid-column:span 1}}
  </style>
</head>
<body>
  <!-- BODY OMITTED FOR BREVITY (unchanged from previous version except card-img hidden) -->
</body>
</html>
